<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Inter Display'; font-weight: 900; src: url('assets/fonts/InterDisplay-Black.otf'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0B1020; }
      #bg-base { position:absolute; inset:0; z-index: 0; background: radial-gradient(120% 80% at 50% 35%, #1a1f33 0%, #0B1020 60%, #05070d 100%); }
      #bg-warm { position:absolute; inset:0; z-index: 1; background: radial-gradient(90% 60% at 50% 40%, rgba(255,160,60,.16), rgba(0,0,0,0) 70%); }
      #bg-night { position:absolute; inset:0; z-index: 2; background: radial-gradient(100% 70% at 50% 40%, #0d2a5c 0%, #06122b 70%); opacity: 0; }
      #vignette { position:absolute; inset:0; background: radial-gradient(130% 95% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.65) 100%); z-index: 50; pointer-events: none; }
      #chip { position:absolute; left: 0; width: 1080px; top: 276px; text-align:center; z-index: 60; }
      #chip span { display:inline-block; font-family:'JetBrains Mono',monospace; font-weight: 800; font-size: 28px; letter-spacing:.14em;
                   color:#FFC83D; padding: 10px 22px; border: 3px solid rgba(255,200,61,.6); border-radius: 999px; background: rgba(8,10,18,.7); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40.8" data-width="1080" data-height="1920">
      <div id="bg-base" class="clip" data-start="0" data-duration="40.8" data-track-index="0"></div>
      <div id="bg-warm" class="clip" data-start="0" data-duration="40.8" data-track-index="5"></div>
      <div id="bg-night" class="clip" data-start="0" data-duration="40.8" data-track-index="6"></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0.0" data-duration="4.3667" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="map" data-composition-id="map" data-composition-src="compositions/map.html" data-start="4.3667" data-duration="13.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="nest" data-composition-id="nest" data-composition-src="compositions/nest.html" data-start="17.8667" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="street" data-composition-id="street" data-composition-src="compositions/street.html" data-start="21.3667" data-duration="3.6666" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="house" data-composition-id="house" data-composition-src="compositions/house.html" data-start="25.0333" data-duration="4.3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="cut" data-composition-id="cut" data-composition-src="compositions/cut.html" data-start="29.3333" data-duration="3.7667" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="brk" data-composition-id="brk" data-composition-src="compositions/brk.html" data-start="33.1" data-duration="2.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="35.6" data-duration="5.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="35.6" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:30"></div>
      <div id="chip" class="clip" data-start="0" data-duration="35.6" data-track-index="3"><span>BORDER ODDITIES · EP. 1</span></div>
      <div id="vignette" class="clip" data-start="0" data-duration="40.8" data-track-index="4" data-layout-ignore></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to("#bg-night", { opacity: 1, duration: 0.4, ease: "power2.out" }, 33.1);
      tl.to("#bg-warm", { opacity: 0, duration: 0.4 }, 33.1);
      tl.to("#bg-night", { opacity: 0.35, duration: 0.5 }, 35.6);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
